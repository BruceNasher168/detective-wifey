<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Bắt được Tiểu tam</title>
  <desc id="desc">Kính lúp soi tách trà xanh trên nền xanh đêm.</desc>
  <defs>
    <linearGradient id="background" x1="64" y1="0" x2="448" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25314C"/>
      <stop offset=".58" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#180F25"/>
    </linearGradient>
    <linearGradient id="ceramic" x1="170" y1="207" x2="265" y2="281" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FEE7"/>
      <stop offset="1" stop-color="#BEDE9B"/>
    </linearGradient>
    <linearGradient id="tea" x1="182" y1="198" x2="249" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A3E635"/>
      <stop offset="1" stop-color="#4D7C0F"/>
    </linearGradient>
    <linearGradient id="rim" x1="122" y1="104" x2="330" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="handle" x1="326" y1="328" x2="411" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Standalone rounded tile; no fonts, embedded bitmaps, or external assets. -->
  <rect width="512" height="512" rx="112" fill="url(#background)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>

  <!-- Offset silhouette gives depth while keeping small-size edges crisp. -->
  <g transform="translate(256 256) scale(1.1) translate(-256 -256)">
  <path d="M318 328L402 412" stroke="#060B17" stroke-opacity=".45" stroke-width="60" stroke-linecap="round"/>
  <path d="M318 318L396 396" stroke="url(#handle)" stroke-width="54" stroke-linecap="round"/>
  <path d="M319 319L339 339" stroke="#BE123C" stroke-width="54"/>

  <circle cx="224" cy="230" r="132" fill="#060B17" fill-opacity=".3"/>
  <circle cx="224" cy="220" r="126" fill="#17233A" stroke="url(#rim)" stroke-width="28"/>
  <circle cx="224" cy="220" r="109" fill="#FB7185" fill-opacity=".055"/>
  </g>

  <!-- Green tea and pale ceramic stay distinct at launcher size. -->
  <g transform="translate(-0.25 -9.5) translate(232.25 235.5) scale(1.265) translate(-232.25 -235.5)">
  <path d="M263 214H274C298 214 298 252 274 252H259" stroke="#D9E8C5" stroke-width="13" stroke-linecap="round"/>
  <path d="M166 207H270L261 257C258 274 241 281 218 281C195 281 178 274 175 257Z" fill="url(#ceramic)"/>
  <ellipse cx="218" cy="207" rx="52" ry="17" fill="#F7FEE7"/>
  <ellipse cx="218" cy="207" rx="42" ry="10" fill="url(#tea)"/>
  <g transform="translate(217 248) scale(1.15) translate(-217 -244)">
    <path d="M204 255C199 240 212 229 234 230C234 247 224 261 204 255Z" fill="#65A30D"/>
    <path d="M205 255L225 238" stroke="#ECFCCB" stroke-width="3" stroke-linecap="round"/>
  </g>
  </g>

  <!-- Lens reflection, kept outside the cup silhouette. -->
  <path d="M144 170C155 153 172 141 191 135" transform="translate(256 256) scale(1.1) translate(-256 -256)" stroke="#FFFFFF" stroke-opacity=".24" stroke-width="8" stroke-linecap="round"/>
</svg>
